name: farmacia_integrada
description: "FarmaLink (Android, offline) - Controle terapêutico (posologia pediátrica) e Estoque (estoque e curva ABC)."
publish_to: "none"
version: 4.15.0+41500

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  url_launcher: ^6.3.0
  shared_preferences: ^2.3.0
  webview_flutter: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/catalog.json
    - assets/codajas.json
    - assets/interacoes.json
    - assets/dose.json
    - assets/guia.html
    - assets/icon_app.svg
    - assets/icon_512.png
