name: Build APK (Farmácia Hospitalar Integrada)
on:
  workflow_dispatch: {}
  push:
    paths: ["flutter_app/**", "data/catalog.json"]
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: cp ../data/catalog.json assets/catalog.json
      - run: bash tool/in_container.sh
      - uses: actions/upload-artifact@v4
        with:
          name: farmacia-icam-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
